Web:
  Address: :8085
  WebURL: localhost:5173
  TLS: null
  HTPasswdFile: .htpasswd
  Prometheus: true
DNS:
  UpstreamServers:
    - 1.1.1.1
    - 9.9.9.9
  Interface: enp34s0
  LocalDomains:
    international-space-station: 10.0.0.2
  Port: 53
  BlockLists:
    - 'https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts '
  BlockedDomains:
    - test.domain.com
