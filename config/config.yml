Auth:
  AuthType: oidc
  IssuerURL: https://authentik.thatjames.nl/application/o/gatekeeper/
  ClientID: gatekeeper
  ClientSecretVar: GATEKEEPER_OIDC_CLIENT_SECRET
  RedirectURL: http://localhost:8085/api/v1/auth/callback
  Scopes:
    - openid
    - email
    - profile
  RoleClaim: groups
  Roles:
    gatekeeper-admins: admin
    gatekeeper-viewers: viewer
